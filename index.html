<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>موقعي الأول</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
    }

    header {
      background: #1e88e5;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      padding: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      margin-top: 0;
      color: #1e88e5;
    }

    footer {
      background: #222;
      color: #aaa;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }

    button {
      background: #1e88e5;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #1565c0;
    }
  </style>
</head>

<body>

  <header>
    <h1>مرحبا بك في موقعي</h1>
    <nav>
      <a href="#">الرئيسية</a>
      <a href="#">الخدمات</a>
      <a href="#">من نحن</a>
      <a href="#">تواصل معنا</a>
    </nav>
  </header>

  <div class="container">
    <h2>ماذا نقدم؟</h2>
    <p>هذا موقع تجريبي لتعلم HTML و CSS وبناء مواقع احترافية.</p>

    <div class="cards">
      <div class="card">
        <h3>البرمجة</h3>
        <p>تعلم أساسيات HTML و CSS و JavaScript.</p>
        <button>المزيد</button>
      </div>

      <div class="card">
        <h3>التجارة الإلكترونية</h3>
        <p>إنشاء متجر إلكتروني عصري وسهل.</p>
        <button>المزيد</button>
      </div>

      <div class="card">
        <h3>لوحة تحكم</h3>
        <p>إدارة المحتوى والمنتجات باحتراف.</p>
        <button>المزيد</button>
      </div>
    </div>
  </div>

  <footer>
    © 2026 - جميع الحقوق محفوظة
  </footer>

</body>
</html>
